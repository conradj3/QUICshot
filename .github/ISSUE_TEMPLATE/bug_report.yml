name: Bug report
description: Report a reproducible problem with the local harness
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS arm64, Ubuntu amd64, etc.
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker and Compose versions
      placeholder: docker --version; docker compose version
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Paste the exact command or Make target you ran.
      render: sh
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Include redacted JSONL events, logs, or smoke-test output.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight
      options:
        - label: I ran `make test`.
        - label: I ran `make smoke`.
        - label: I redacted secrets, hostnames, and customer data.